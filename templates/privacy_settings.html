<!-- templates/privacy_settings.html -->
{% extends "base.html" %}

{% block title %}隐私设置{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h1>🔒 隐私设置</h1>
    </div>
    <div class="card-body">
        <form method="POST">
            {{ form.hidden_tag() }}

            <div class="form-group">
                <label>
                    {{ form.favorites_private() }} {{ form.favorites_private.label.text }}
                </label>
                <p style="color: #666; font-size: 0.9rem; margin-top: 0.5rem;">
                    开启后，其他用户将无法看到你的收藏夹内容
                </p>
            </div>

            {{ form.submit(class="btn btn-primary") }}
        </form>
    </div>
</div>
{% endblock %}
